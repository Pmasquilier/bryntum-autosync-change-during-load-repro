<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>autoSync never sends a change made while a load or sync response is applied</title>
    <link rel="stylesheet" href="/node_modules/@bryntum/schedulerpro/schedulerpro.css">
    <link rel="stylesheet" href="/node_modules/@bryntum/schedulerpro/material3-light.css">
    <style>
        body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 8px 12px; border-bottom: 1px solid #ddd; display: flex; gap: 8px; align-items: center; }
        #container { flex: 1; min-height: 0; }
        #log { height: 170px; overflow: auto; margin: 0; padding: 8px 12px; background: #f6f6f6; font-size: 12px; }
    </style>
</head>
<body>
    <header>
        <button id="during-load">Remove an event while a lazy-loaded page is applied</button>
        <button id="during-sync">Remove an event while a sync response is applied</button>
    </header>
    <div id="container"></div>
    <pre id="log"></pre>
    <script type="module" src="/main.js"></script>
</body>
</html>
